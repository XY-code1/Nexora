name: test
on: [push, pull_request]
permissions:
  contents: read
env:
  PYTHONUTF8: "1"
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.lock.txt
      - run: pip install --require-hashes -r requirements-ci.lock.txt
      - run: python tests/test_smoke.py
      - run: python tests/test_mcp_security.py
      - run: python tests/test_mcp_protocol.py
      - run: python tests/test_mcp_host_config.py
      - run: python tests/test_security_atomicity.py
      - run: python tests/test_security_lifecycle.py
      - run: python tests/test_ai_connections.py
      - run: python tests/test_memory_lifecycle.py
      - run: python tests/test_review_app.py
      - run: python tests/test_core_contract.py
      - run: python tests/test_local_api.py
      - run: python tests/test_visualization.py
      - run: python tests/test_onboarding.py
      - run: python tests/test_human3.py
      - run: python tests/test_vault_management.py
      - run: python tests/test_vault_product.py
      - run: python tests/test_windows_acl.py
      - run: python tests/test_sync.py
      - run: python tests/test_release_gate.py
      - run: python tests/test_monthly_reflection.py
      - run: python tests/test_security_center.py
      - run: python tests/test_growth.py
      - run: python tests/test_phase8_acceptance.py
      - run: python tests/test_backup_recovery.py
      - run: python tests/test_release_packaging.py
      - run: python tests/test_overview.py
      - run: python tests/test_github.py
      - run: python tests/test_importer.py
      - run: python tests/test_provider_adapters.py
      - run: python tests/test_provider_auth.py
      - run: python -c "import mcp_server"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: ruff check .
      - run: python scripts/check_release.py
      - run: pip-audit -r requirements.lock.txt
      - run: npm audit --audit-level=high --registry=https://registry.npmjs.org
        working-directory: apps/web
      - run: mkdir -p artifacts && cyclonedx-py requirements requirements.lock.txt --output-reproducible --of JSON -o artifacts/python-sbom.json
      - run: npm sbom --sbom-format cyclonedx > ../../artifacts/node-sbom.json
        working-directory: apps/web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase6-sbom
          path: artifacts/*.json
      - run: python tests/test_launcher.py
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e
        working-directory: apps/web

  windows-clean:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements.lock.txt
      - run: python tests/test_mcp_protocol.py
      - run: python tests/test_visualization.py
      - run: python tests/test_onboarding.py
      - run: python tests/test_human3.py
      - run: python tests/test_vault_product.py
      - run: python tests/test_windows_acl.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: python tests/test_launcher.py
      - run: python scripts/check_release.py

  windows-installer-smoke:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements.lock.txt
      - run: python -m pip install pyinstaller
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: choco install innosetup -y --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: ./scripts/build_windows.ps1 -Version 1.0.4.1
      - name: Install, start, and uninstall the packaged app
        shell: pwsh
        run: ./tests/windows_installer_smoke.ps1 -Version 1.0.4.1
      - name: Validate upgrade, data retention, uninstall, and reinstall
        shell: pwsh
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP "nexora-v1.0.4"
          New-Item -ItemType Directory -Force -Path $baseline | Out-Null
          gh release download v1.0.4 --repo XY-code1/Nexora --pattern "personal-ai-profile-setup-1.0.4.exe" --dir $baseline
          $installer = Join-Path $baseline "personal-ai-profile-setup-1.0.4.exe"
          $expected = "ce17464d9a8b660d265f866bcf36609b2134bdd8df89ee8cd5558ff55f20993a"
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw "Downloaded v1.0.4 installer hash mismatch."
          }
          ./tests/windows_installer_upgrade.ps1 `
            -BaselineInstaller $installer `
            -CandidateInstaller "artifacts/personal-ai-profile-setup-1.0.4.1.exe"
        env:
          GH_TOKEN: ${{ github.token }}
