name: release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements.lock.txt
      - run: python -m pip install pyinstaller
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          if ($v -notlike "v*") { $v = "${{ inputs.version }}" }
          if (-not $v) { $v = "0.0.0-dev" }
          if ($v -like "v*") { $v = $v.Substring(1) }
          Write-Output "version=$v" >> $env:GITHUB_OUTPUT
      - name: Build installer
        shell: pwsh
        run: ./scripts/build_windows.ps1 -Version "${{ steps.version.outputs.version }}"
        env:
          SIGN_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT }}
          SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
      - name: Upload installer artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: windows-installer
          path: |
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@e7a8f85e1c67a31e6ed99a94b41bd0b71bbee6b8 # v2
        with:
          files: |
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
