# Dependabot configuration.
#
# Python dependencies are deliberately excluded: runtime and CI
# dependencies are pinned in hashed lock files (requirements.lock.txt,
# requirements-ci.lock.txt) that are regenerated explicitly with
# `pip-compile --generate-hashes`. A pull request that bumps
# requirements.txt without regenerating the lock would break CI, so
# Python updates are handled manually as a lock-file change.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/apps/web"
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
