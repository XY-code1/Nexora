name: Feature request
description: Suggest an improvement to NEXORA
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        NEXORA has deliberate non-goals: no silent memory confirmation, no automatic psychological labels, no unrestricted AI file access, no screen / keyboard / microphone capture, and no default cloud collection. Requests that require these will not be accepted.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what is blocking you?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to change?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else did you try, and why was it not enough?
    validations:
      required: false
